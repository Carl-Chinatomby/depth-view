[project]
name = "depth-view"
version = "0.1.0"
description = "Upload a photo, get an interactive 3D point cloud via monocular depth estimation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0,<2.3.0",
    "transformers>=4.40.0,<5.0.0",
    "gradio>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "plotly>=5.20.0",
    "hydra-core>=1.3.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "numpy<2.0.0",
    "matplotlib>=3.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depthview"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download models (deselect with '-m not slow')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B905"]
